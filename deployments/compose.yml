services:
  llm-server:
    # Pinned from ghcr.io/ggml-org/llama.cpp:server-cuda (2026-07-23) -- see
    # fmt/docker/dockerfile.md, never `latest`/a moving tag in production.
    # Bump deliberately: re-pull the tag, re-pin the new digest, note it here.
    image: ghcr.io/ggml-org/llama.cpp@sha256:1b3d1458ccda7287feab41b8001311acc03e24cde99ec0a2908fe83830562f38
    container_name: llm-server
    restart: unless-stopped
    # Cgroup-level CPU restriction -- set LLM_CPUSET in .env (e.g. "8-19" for
    # a specific core range) if you want to pin inference to particular
    # cores. Empty (default) = unrestricted, uses all cores. Confirmed more
    # reliable than llama.cpp's own thread-affinity flags (which don't
    # actually restrict the OS affinity mask on at least one tested setup)
    # and than external `taskset -pc` after the fact (needs host root
    # against a root-owned container process, races new worker threads
    # spawning after the readiness check). Cgroups apply to the whole
    # container atomically and cover threads spawned at any point. See
    # README.md "Tuning" for how/when this matters.
    cpuset: "${LLM_CPUSET:-}"
    networks:
      - local-llm-net
    environment:
      - GGML_CUDA_GRAPH_OPT=1
    volumes:
      - ./models:/models
    # Not reachable from the LAN or off-host -- only Caddy (see the caddy
    # service + certs/Caddyfile) is bound to a host-facing port for that.
    # The one exception: a loopback-only port for scripts/benchmark.sh, which
    # measures raw server performance and needs a direct, TLS-free connection
    # so proxy overhead doesn't skew the numbers. 127.0.0.1 binding means it's
    # unreachable from any other device regardless -- doesn't reopen the LAN
    # exposure the "Caddy is the sole entry point" design is actually about.
    ports:
      - "127.0.0.1:8080:8080"
    # Healthcheck (curl -f localhost:8080/health) is baked into the image --
    # inherited automatically, drives the depends_on ordering below.
    command:
      - -m
      - /models/${MODEL_FILE:?Set MODEL_FILE in .env -- see .env.example}
      - -ngl
      - "${NGL:-99}"
      # MoE-only flag (forces N expert layers to CPU/RAM instead of GPU) --
      # a no-op for dense models. Default 0 = fully GPU; raise it if your
      # model+context doesn't fit in VRAM. See README.md "Swapping the model".
      - --n-cpu-moe
      - "${N_CPU_MOE:-0}"
      - -c
      - "${CONTEXT_SIZE:-8192}"
      - --parallel
      - "1"
      - -b
      - "4096"
      - -ub
      - "2048"
      - -t
      - "${THREADS:-4}"
      - --no-mmap
      - --flash-attn
      - "on"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      # RAM-side prompt cache (stores past prompts' KV state for reuse on
      # similar-prefix requests). Default 8192MiB was thrashing under
      # normal load on this box -- Ultron is a daily-use workstation
      # (browser, IDEs, a local k8s control plane, several opencode/claude
      # sessions), not a dedicated inference host, and llm-server's ~20GB
      # RSS (N_CPU_MOE-offloaded expert weights) already leaves little
      # slack. Lower cap trades some prompt-reuse speed for headroom.
      - --cache-ram
      - "${CACHE_RAM_MIB:-2048}"
      # Required for real tool-calling: renders the model's actual chat
      # template (via minja) and engages llama.cpp's matching tool-call
      # parser. Without this, Qwen3's <tool_call><function=...> text (its
      # native format, straight from the GGUF's own chat template) streams
      # through as literal assistant message content instead of being
      # parsed into a structured tool_calls response OpenWebUI can execute.
      - --jinja
      - --metrics
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Explicit GPU device nodes. On Docker with the systemd cgroup driver (the
    # Ubuntu default) a running container can silently lose GPU access
    # ("Failed to initialize NVML: Unknown Error") whenever runc rewrites its
    # device cgroup, e.g. after `docker update` or a systemd reload. Listing the
    # nodes here makes runc aware of them, so the access survives. See
    # https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/troubleshooting.html
    # Multi-GPU host: add /dev/nvidia1 and so on. If a node below does not exist
    # on your host, remove that line.
    devices:
      - /dev/nvidiactl
      - /dev/nvidia0
      - /dev/nvidia-uvm
      - /dev/nvidia-uvm-tools

  searxng:
    # Pinned from searxng/searxng:latest (2026-07-23) -- see fmt/docker/dockerfile.md.
    image: searxng/searxng@sha256:854f239d5c181db9c4282cd0ffc1737a61232dd6ad0ea964028b96df17d7758a
    container_name: searxng
    restart: unless-stopped
    networks:
      - local-llm-net
    volumes:
      - ./searxng:/etc/searxng
    # No host ports -- see the note on llm-server above. Reachable only
    # through Caddy now, same as every other service.
    # /healthz is a real lightweight liveness endpoint -- returns instantly,
    # no engine dispatch. The original ?q=healthcheck&format=json probe was
    # a genuine search query, fired every 15s for as long as the container
    # ran, and got the outbound IP rate-limited by real engines (Google CSE,
    # Brave) -- confirmed via searxng's own logs (2026-07-23).
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s

  openwebui:
    # Pinned from ghcr.io/open-webui/open-webui:v0.11.0 (2026-07-27) -- a
    # real version tag now that one exists, not the `main` branch tag this
    # was pinned from originally. Bump deliberately: re-pull the tag,
    # re-pin the new digest, note it here. v0.11.0 includes a DB schema
    # migration -- back up openwebui-data/ before bumping this again.
    image: ghcr.io/open-webui/open-webui@sha256:72c0ba641ba75e7aa52655cb242570906ececd09b1140fb736483038a22b3228
    container_name: openwebui
    restart: unless-stopped
    networks:
      - local-llm-net
    depends_on:
      llm-server:
        condition: service_healthy
      searxng:
        condition: service_healthy
    # Mapping style (not the `- KEY=value` list form used elsewhere in this
    # file) so RAG_TEMPLATE/QUERY_GENERATION_PROMPT_TEMPLATE below can use
    # real multi-line YAML block scalars -- can't mix both forms under one
    # `environment:` key, so this applies to every var here, not just those
    # two.
    #
    # QUOTE ANY VALUE THAT LOOKS LIKE A BOOLEAN OR NUMBER (True/False/yes/no/
    # a bare number). The list form below was immune to this -- everything
    # was always a string. This mapping form is real YAML: an unquoted
    # `ENABLE_FOO: False` becomes a YAML boolean, not the string "False"
    # OpenWebUI's own env parsing expects, and nothing here will error --
    # it'll just silently misconfigure that one variable. Every existing
    # boolean/numeric-looking value below is already quoted; keep that
    # pattern for anything you add.
    environment:
      ENABLE_SIGNUP: "False"
      # llm-server is now on the same docker network (local-llm-net) instead
      # of being reached via host-gateway -- simpler and one less thing that
      # breaks if the host-published port ever changes, now that llm-server
      # doesn't publish one at all.
      OPENAI_API_BASE_URL: http://llm-server:8080/v1
      # Not a real secret -- llama.cpp's server doesn't validate this value at
      # all, it's only set because OpenWebUI's OpenAI-compatible client
      # requires some non-empty API key to be configured.
      OPENAI_API_KEY: sk-local
      ENABLE_WEB_SEARCH: "True"
      WEB_SEARCH_ENGINE: searxng
      # Goes through Caddy's public route, NOT directly to searxng:8080.
      # SearXNG's server.base_url (searxng/settings.yml) makes its
      # ReverseProxyPathFix middleware unconditionally force every request's
      # Host/scheme to base_url's, regardless of how the request actually
      # arrived -- so a direct container-to-container call gets a 308
      # redirect to this exact public URL either way (confirmed via
      # searx/flaskfix.py's source and a live request trace, 2026-07-27).
      # Going through Caddy directly avoids that pointless redirect hop,
      # and matches what the URL will be rewritten to anyway.
      SEARXNG_QUERY_URL: https://${DOMAIN}/search/search?q=<query>
      # ISO language code to bias SearXNG results toward (e.g. "no"), or
      # "all" for no bias -- set SEARXNG_LANGUAGE in .env. Matters because
      # OpenWebUI's own query-generation step can drift into English
      # regardless of what language you're chatting in -- see
      # QUERY_GENERATION_PROMPT_TEMPLATE below.
      SEARXNG_LANGUAGE: ${SEARXNG_LANGUAGE:-all}
      # Defaults (3/3) turned out too narrow for anything beyond a single
      # fact lookup -- confirmed live (2026-07-27): a request to compare
      # prices across ~5 different stores structurally can't work when
      # only 3 pages ever get fetched and only 3 chunks ever reach the
      # model's context (frequently all from the same one page). First
      # raised to 8/10 -- still too narrow. Checked SearXNG directly for a
      # real query: 75 raw hits, 21 unique domains, ~19 genuinely relevant
      # Norwegian retailers -- raised to 20 to actually capture that real
      # pool instead of discarding most of it.
      WEB_SEARCH_RESULT_COUNT: "20"
      WEB_SEARCH_CONCURRENT_REQUESTS: "5"
      RAG_TOP_K: "20"
      RAG_TOP_K_RERANKER: "20"
      # Default chunk_size=1000 splits dense e-commerce listing pages
      # (many small product+price blocks) into many near-identical tiny
      # chunks, none individually distinctive enough to rank in the top-K
      # for a broad query -- confirmed live (2026-07-27): a page with real
      # embedded prices (verified via direct fetch) still didn't surface
      # them until chunks were widened enough to keep a product block and
      # its price together.
      CHUNK_SIZE: "3000"
      CHUNK_OVERLAP: "300"
      # Needed because of the above: this is our own private CA (see
      # scripts/generate-local-ca.sh), which OpenWebUI's Python/aiohttp
      # client doesn't trust by default -- SSL_CERT_FILE is a standard
      # OpenSSL/Python env var that ssl.create_default_context() (what
      # aiohttp's default connector uses) honors as an additional trust
      # source.
      SSL_CERT_FILE: /certs/ca.crt
      # PersistentConfig only reads these two on first DB creation --
      # scripts/bootstrap-openwebui.sh re-patches the DB directly too, for
      # a DB that already exists with drifted/default values. Keep both in
      # sync if you change the wording.
      #
      # Qwen3 was observed silently translating a Norwegian question into
      # an English search query ("en norsk webbutikk" -> generic English),
      # losing locale-specific intent and pulling in wrong-country results
      # -- this makes language-preservation explicit and first.
      QUERY_GENERATION_PROMPT_TEMPLATE: |
        ### Task:
        Analyze the chat history to determine the necessity of generating search queries, in the SAME language the user is writing in -- do not translate the query into English or any other language. If the user mentions a country, region, store, or brand, keep that term in the query exactly. By default, prioritize generating 1-3 broad and relevant search queries unless it is absolutely certain that no additional information is required.

        ### Guidelines:
        - Respond EXCLUSIVELY with a JSON object. Any form of extra commentary, explanation, or additional text is strictly prohibited.
        - When generating search queries, respond in the format: { "queries": ["query1", "query2"] }, ensuring each query is distinct, concise, and relevant to the topic.
        - If and only if it is entirely certain that no useful results can be retrieved by a search, return: { "queries": [] }.
        - Err on the side of suggesting search queries if there is any chance they might provide useful or updated information.
        - Today is: {{CURRENT_DATE}}.

        ### Output:
        Strictly return in JSON format:
        {
          "queries": ["query1", "query2"]
        }

        ### Chat History:
        <chat_history>
        {{MESSAGES:END:6}}
        </chat_history>
      # Two things observed live (2026-07-27): (1) a real search genuinely
      # ran but the model still claimed "I cannot search the web" -- the
      # default template calls injected content generic "provided context"
      # with no indication it's this message's own live search result, so
      # the model fell back on its trained denial reflex; (2) even past
      # that, the model blended real retrieved content with remembered
      # store names, and invented a plausible-looking-but-nonexistent
      # domain when told to "always cite a store". This template forbids
      # the denial outright and requires the literal source domain per
      # claim (not a free-text company name), which makes fabricated
      # claims checkable instead of just prohibited by instruction.
      RAG_TEMPLATE: |
        ### Task:
        Respond to the user query using ONLY the provided context below, incorporating inline citations in the format [id] **only when the <source> tag includes an explicit id attribute** (e.g., <source id="1">).

        ### Critical guideline:
        The <context> below is the result of a REAL, live web search performed automatically for this exact message, just now -- it is NOT your training data and NOT a hypothetical. Never say you "cannot search the web" or "cannot fetch new information" when a <context> block is present -- that is always false when this template is in use; the search already happened.
        Never mention a specific store, retailer, brand, product, or price that does not literally appear in the <context> below, even if you recognize the name from your own training. Do not fill gaps with remembered stores or well-known retailers -- if the context only covers 2 stores, discuss only those 2; do not pad the answer with others you merely recall. If a detail (like a price, or a 5th store) genuinely isn't present anywhere in the context, say plainly that it wasn't found in the pages retrieved -- do not substitute your own general knowledge to fill the gap, and do not suggest websites you have not actually seen search results from.

        ### Source attribution (critical):
        When stating a price, product, or claim, you MUST attribute it to the exact source it came from using its [id] citation -- never blend facts from two different sources into one attributed claim, and never state a company/store name that does not match the <source> tag's actual domain for that [id]. In any table, include a column with the literal domain (e.g. skyt.no, vapensmia.no) the row's data came from, taken directly from the <source> tag -- not a nicer-sounding company name you infer or recall. This lets the user judge the source's legitimacy themselves; do not omit, prettify, or substitute it.

        ### Guidelines:
        - If the answer is in the context, state it directly and confidently, citing the source.
        - If uncertain, ask the user for clarification.
        - Respond in the same language as the user's query.
        - If the context is unreadable or of poor quality, inform the user and provide the best possible answer from what IS readable.
        - **Only include inline citations using [id] (e.g., [1], [2]) when the <source> tag includes an id attribute.**
        - Do not cite if the <source> tag does not contain an id attribute.
        - Do not use XML tags in your response.
        - Ensure citations are concise and directly related to the information provided.

        ### Example of Citation:
        If the user asks about a specific topic and the information is found in a source with a provided id attribute, the response should include the citation like in the following example:
        * "According to the study, the proposed method increases efficiency by 20% [1]."

        ### Output:
        Provide a clear and direct response to the user's query, including inline citations in the format [id] only when the <source> tag with id attribute is present in the context. Never introduce a store, price, or product not literally present in <context>. In tables, always include the real source domain per row.

        <context>
        {{CONTEXT}}
        </context>
    volumes:
      - ./openwebui-data:/app/backend/data
      - ./certs/ca.crt:/certs/ca.crt:ro
    # No host ports -- see the note on llm-server above.

  dashy:
    # Pinned from lissy93/dashy:latest (2026-07-23) -- see fmt/docker/dockerfile.md.
    image: lissy93/dashy@sha256:6f9ce4b2b98352376df24de34796cc423f21d216405486e461452dd76becfe2a
    container_name: dashy
    restart: unless-stopped
    networks:
      - local-llm-net
    # config-validator.js reads from user-data/conf.yml (path controlled by
    # USER_DATA_DIR, default 'user-data') -- NOT public/ or dist/. Those two
    # are just static demo copies baked into the image; mounting over them
    # (an earlier mistake here) has no effect on what the app actually uses.
    volumes:
      - ./portal/conf.yml:/app/user-data/conf.yml
      # Static docs site (real copyable text/tables, not icon tiles; a real
      # architecture diagram) -- served from public/, which express.static
      # still serves for any path not present in user-data/ or dist/. Whole
      # directory mounted (not single files) since it's now index/api/
      # environment/docs.css, not just one page.
      - ./portal/docs:/app/public/docs:ro
      # Drone Workshop viewer: a small client-side markdown renderer
      # (portal/drone-workshop/index.html, reuses docs.css) fetching its
      # content from a second, nested mount of the actual drone_workshop
      # project below -- keeps that project as the single source of truth,
      # no copying/build step needed when its docs change.
      - ./portal/drone-workshop:/app/public/drone-workshop:ro
      - ../drone_workshop:/app/public/drone-workshop/content:ro
      # Drone Guide (a separate, full Docusaurus site) is NOT served from
      # here -- Docusaurus's extensionless links need try_files-style
      # extension resolution that Dashy's static serving doesn't have, so
      # it's served directly by Caddy instead. See the caddy service below
      # and certs/Caddyfile's /drone-guide/* block.
      # Downloadable root CA (public cert only, never the key) so people
      # can get it without filesystem access -- see portal/docs/api.html's TLS note.
      - ./certs/ca.crt:/app/public/ca.crt:ro
    # No host ports -- see the note on llm-server above.

  caddy:
    # Pinned from caddy:2.9.1-alpine (2026-07-23) -- see fmt/docker/dockerfile.md.
    image: caddy@sha256:b4e3952384eb9524a887633ce65c752dd7c71314d2c2acf98cd5c715aaa534f0
    container_name: caddy
    restart: unless-stopped
    networks:
      - local-llm-net
    depends_on:
      llm-server:
        condition: service_healthy
      searxng:
        condition: service_healthy
      openwebui:
        condition: service_healthy
      dashy:
        condition: service_started
    # Only used by the /admin/* basic_auth block in certs/Caddyfile --
    # harmless if compose.admin.yml is never brought up, the route just
    # never gets hit. Caddy does its own {$VAR} substitution at runtime
    # from its process environment, separate from docker compose's
    # ${VAR} substitution of the Caddyfile bind-mount path itself.
    environment:
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-}
    # Filenames are fixed regardless of your domain -- generate-local-ca.sh
    # always writes server.crt/server.key; only the Caddyfile's site
    # addresses (and the cert's SAN) encode your actual domain.
    volumes:
      - ./certs/Caddyfile:/etc/caddy/Caddyfile
      - ./certs/server.crt:/certs/server.crt:ro
      - ./certs/server.key:/certs/server.key:ro
      # Drone Guide static build, served directly (see Caddyfile's
      # /drone-guide/* block). Mounts the repo root, not build/ itself:
      # Docusaurus fully replaces build/ on each rebuild, and a bind mount of
      # the directory would keep pointing at the deleted inode (site 404s
      # until the container restarts). Mounting the parent survives rebuilds
      # with zero downtime -- the site root is /srv/drone-guide/build.
      - ../drone_workshop:/srv/drone-guide:ro
    # The sole entry point for all services. Path-routed under :443
    # (dashy/searxng/llm-server/grafana) except OpenWebUI, which can't be
    # path-routed -- see certs/Caddyfile.
    ports:
      - "443:443"
      - "3000:3000"

networks:
  local-llm-net:
    external: true
