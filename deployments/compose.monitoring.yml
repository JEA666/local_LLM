services:
  prometheus:
    # Pinned from prom/prometheus:v2.55.1 -- see fmt/docker/dockerfile.md.
    image: prom/prometheus@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    container_name: prometheus
    restart: unless-stopped
    networks:
      - local-llm-net
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-data:/prometheus
    # Overrides the image's default CMD (Docker replaces, not merges) --
    # the first 4 flags are its stock defaults, `retention.time` is the only
    # addition. Default retention is 15d; 7d is plenty for a single-host
    # LAN dashboard nobody's doing month-over-month analysis on, and keeps
    # both disk (prometheus-data/) and the in-memory head block smaller.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --storage.tsdb.retention.time=7d
    # node-exporter runs with network_mode: host (see below) and isn't
    # reachable by container name -- reached via host-gateway instead, the
    # same mechanism used before other services moved onto a shared network.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # No host port -- internal only, same "Caddy is the sole entry point"
    # invariant as the main stack. Only Grafana needs to reach this.

  node-exporter:
    # Pinned from prom/node-exporter:v1.8.2 -- see fmt/docker/dockerfile.md.
    image: prom/node-exporter@sha256:4032c6d5bfd752342c3e631c2f1de93ba6b86c41db6b167b9a35372c139e7706
    container_name: node-exporter
    restart: unless-stopped
    # Host network mode is the standard, documented way to run node-exporter
    # -- without it, it reports the container's own network namespace
    # instead of the host's. It only exposes a read-only /metrics endpoint,
    # no service surface, so this is a low-risk, well-established exception
    # to normal container networking.
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($$|/)

  cadvisor:
    # Pinned from gcr.io/cadvisor/cadvisor:v0.55.1 -- see fmt/docker/dockerfile.md.
    # v0.49.1 shipped a Docker API client stuck at v1.41; this host's Docker
    # Engine (29.1.3) requires a minimum of v1.44, so the docker container
    # factory failed to register and cadvisor only ever emitted raw cgroup
    # metrics -- no per-container labels, no data in the dashboard. v0.55.1's
    # client registers successfully (confirmed via container logs).
    image: gcr.io/cadvisor/cadvisor@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    container_name: cadvisor
    restart: unless-stopped
    networks:
      - local-llm-net
    # Read-only docker.sock + host filesystem access -- needed to introspect
    # per-container resource usage. A real, deliberate exception to this
    # project's usual "no docker.sock" stance (see the Dashy portal, which
    # explicitly avoided it) -- flagged here rather than added quietly.
    # Everything is mounted read-only; cadvisor exposes only its own
    # /metrics endpoint, no control surface into Docker itself.
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    privileged: false
    # cAdvisor opens many fds watching cgroups across every container on the
    # host -- crashed on startup with "inotify_init: too many open files"
    # against Docker's default nofile ulimit (confirmed: plenty of headroom
    # on the actual system-wide inotify limit, this is a per-container fd
    # limit, not a host-level one).
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  gpu-exporter:
    # Pinned from utkuozdemir/nvidia_gpu_exporter:1.3.1 -- see
    # fmt/docker/dockerfile.md. Wraps nvidia-smi; confirmed real GPU
    # utilization/VRAM/temp/power output via a standalone test run.
    image: utkuozdemir/nvidia_gpu_exporter@sha256:9c6180c26d33f29eb92bad6e74fd4dbf5184c625724f67553c57865876c50a2a
    container_name: gpu-exporter
    restart: unless-stopped
    networks:
      - local-llm-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Explicit GPU device nodes so the container keeps GPU access when runc
    # rewrites its device cgroup (otherwise "Failed to initialize NVML: Unknown
    # Error" and empty GPU panels). Same reason as llm-server in compose.yml,
    # see the note there. NVML only needs these two. Multi-GPU: add /dev/nvidia1.
    devices:
      - /dev/nvidiactl
      - /dev/nvidia0
    # No host port -- internal only, same as the other exporters.

  grafana:
    # Pinned from grafana/grafana:11.3.1 -- see fmt/docker/dockerfile.md.
    image: grafana/grafana@sha256:fa801ab6e1ae035135309580891e09f7eb94d1abdbd2106bdc288030b028158c
    container_name: grafana
    restart: unless-stopped
    networks:
      - local-llm-net
    environment:
      # Dashboards/datasources are provisioned from files (below), not
      # hand-clicked -- matches fmt/observability/grafana.md's "dashboard as
      # code" principle, adapted from ConfigMaps to bind-mounts.
      #
      # Anonymous Viewer access: same no-auth-on-LAN posture already used for
      # Dashy and SearXNG -- dashboards hold no sensitive data, just metrics.
      # Needed for the Dashy "System Overview" kiosk-mode deep link to work
      # at all: with anonymous disabled, the link hits Grafana's login page
      # first, and the post-login redirect drops the dashboard+kiosk target,
      # landing on the plain dashboard list instead (confirmed bug). Editing/
      # admin still requires real login -- Viewer role can't change anything.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      # Path-routed under Caddy's single :443 instead of its own port --
      # Grafana needs to know its own external prefix to generate correct
      # links/assets. Caddy forwards the full /obs/... path unstripped
      # (see certs/Caddyfile), matching serve_from_sub_path's expectation.
      - GF_SERVER_ROOT_URL=https://${DOMAIN}/obs/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana-data:/var/lib/grafana
    # No host port -- reachable only via Caddy, same as every other service.
    # Path-routed at /obs/ under Caddy's main :443 (see certs/Caddyfile) --
    # no dedicated port needed here, unlike the earlier port-per-service setup.

networks:
  local-llm-net:
    external: true
